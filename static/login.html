<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Auth Starter</title>
  <link rel="stylesheet" href="/static/css/styles.css" />
</head>
<body>
  <header class="navbar">
    <nav class="container" aria-label="Main navigation">
      <a href="/" class="navbar__brand">Auth Starter</a>
    </nav>
  </header>

  <main class="auth-wrapper">
    <div class="auth-card">
      <h1>Log In</h1>

      <p id="form-error" class="alert alert-error hidden" role="alert"></p>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required />
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary btn-block">Log In</button>
      </form>

      <p class="auth-card__footer">
        Don't have an account? <a href="/register.html">Sign up</a><br />
        <a href="/">&larr; Back to home</a>
      </p>
    </div>
  </main>

  <script src="/static/js/common.js"></script>
  <script src="/static/js/login.js"></script>
</body>
</html>
